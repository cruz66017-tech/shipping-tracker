<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Track Your Shipment</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #f4f6f8; margin: 0; padding: 20px; }
    .container { max-width: 800px; margin: 0 auto; background: white; border-radius: 12px; padding: 24px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
    h1 { margin-top: 0; }
    input { width: 100%; padding: 12px; font-size: 16px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; }
    button { margin-top: 12px; padding: 12px 20px; background: #0b5cff; color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; }
    button:hover { background: #0847cc; }
    .shipment { margin-top: 24px; }
    .timeline { border-left: 2px solid #0b5cff; margin-left: 10px; padding-left: 20px; }
    .event { margin-bottom: 20px; position: relative; }
    .event::before { content: ''; position: absolute; left: -27px; top: 4px; width: 12px; height: 12px; background: #0b5cff; border-radius: 50%; }
    .event .status { font-weight: bold; }
    .event .meta { color: #666; font-size: 14px; }
    .error { color: #d32f2f; margin-top: 16px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Track Your Shipment</h1>
    <p>Enter your tracking number to see the latest status.</p>
    <input id="trackingInput" placeholder="e.g. 1Z999AA10123456784" />
    <button onclick="track()">Track</button>
    <div id="result"></div>
  </div>

  <script>
    async function track() {
      const num = document.getElementById('trackingInput').value.trim();
      const result = document.getElementById('result');

      if (!num) {
        result.innerHTML = '<p class="error">Please enter a tracking number.</p>';
        return;
      }

      result.innerHTML = '<p>Loading...</p>';

      try {
        const res = await fetch('/api/track/' + encodeURIComponent(num));
        if (!res.ok) throw new Error('Not found');

        const data = await res.json();
        const events = data.events
          .slice()
          .sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));

        result.innerHTML = `
          <div class="shipment">
            <h2>${data.status}</h2>
            <p><strong>Tracking:</strong> ${data.trackingNumber}</p>
            <p><strong>From:</strong> ${data.from || '—'}<br>
               <strong>To:</strong> ${data.to || '—'}</p>
            <p><strong>Service:</strong> ${data.service || '—'}</p>
            <p><strong>Estimated Delivery:</strong> ${data.estimatedDelivery || '—'}</p>
            <h3>Tracking History</h3>
            <div class="timeline">
              ${events.map(e => `
                <div class="event">
                  <div class="status">${e.status}</div>
                  <div class="meta">${new Date(e.timestamp).toLocaleString()} — ${e.location}</div>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      } catch (err) {
        result.innerHTML = '<p class="error">Tracking number not found. Please check and try again.</p>';
      }
    }
  </script>
</body>
</html>
